name: Mirror to ECR

on:
  workflow_run:
    workflows: ["Release"]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to mirror, e.g. v0.8.0-khaojai"
        required: true
        type: string

concurrency:
  group: mirror-to-ecr-${{ inputs.tag || github.event.workflow_run.head_branch }}
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read
  packages: read

env:
  AWS_REGION: ap-southeast-1
  ECR_REGISTRY: 143495498933.dkr.ecr.ap-southeast-1.amazonaws.com

jobs:
  mirror:
    if: >-
      github.repository == 'khaojai/multica' &&
      (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Resolve tag
        id: tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
          RUN_REF: ${{ github.event.workflow_run.head_branch }}
        run: |
          set -euo pipefail
          tag="${INPUT_TAG:-$RUN_REF}"
          if echo "$tag" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+-khaojai(\.[0-9]+)?$'; then
            echo "valid=true" >> "$GITHUB_OUTPUT"
            echo "name=$tag" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Skipping '$tag': not a vX.Y.Z-khaojai[.N] release tag"
            echo "valid=false" >> "$GITHUB_OUTPUT"
          fi

      # The role trusts only repo:khaojai/multica:ref:refs/heads/main, so this workflow must run from main.
      - name: Configure AWS credentials
        if: steps.tag.outputs.valid == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::143495498933:role/github-actions-khaojai-multica-ecr-push
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to ECR
        if: steps.tag.outputs.valid == 'true'
        uses: aws-actions/amazon-ecr-login@v2

      - name: Log in to ghcr
        if: steps.tag.outputs.valid == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3
        if: steps.tag.outputs.valid == 'true'

      - name: Copy images
        if: steps.tag.outputs.valid == 'true'
        env:
          TAG: ${{ steps.tag.outputs.name }}
        run: |
          set -euo pipefail
          SUMMARY="${GITHUB_STEP_SUMMARY:-/dev/null}"

          for name in backend web; do
            repo="multica/$name"
            dst="$ECR_REGISTRY/$repo:$TAG"
            src="ghcr.io/khaojai/multica-$name:$TAG"

            if aws ecr describe-images --repository-name "$repo" --image-ids "imageTag=$TAG" >/dev/null 2>&1; then
              echo "$repo:$TAG already in ECR, skipped"
              echo "- $repo:$TAG already in ECR, skipped" >> "$SUMMARY"
              continue
            fi

            docker buildx imagetools create --tag "$dst" "$src"
            docker buildx imagetools inspect "$dst"
            echo "- $repo:$TAG copied from $src" >> "$SUMMARY"
          done
